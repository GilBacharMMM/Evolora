<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- the circumference -->
  <circle cx="200" cy="200" r="150" fill="#e1f0f1" stroke="#0e6b73" stroke-width="5"/>
  <!-- a diameter -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#1f2933" stroke-width="4"/>
  <!-- a radius, up and to the right -->
  <line x1="200" y1="200" x2="306" y2="94" stroke="#b5562b" stroke-width="4"/>
  <!-- the center -->
  <circle cx="200" cy="200" r="7" fill="#1f2933"/>
</svg>
